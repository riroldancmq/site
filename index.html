<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Control de Vencimientos</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const STORAGE_KEY = 'vencimientos_productos';

        const loadProducts = () => {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    const parsed = JSON.parse(stored);
                    if (Array.isArray(parsed)) return parsed;
                }
            } catch (e) {}
            return [{ id: 1, name: 'Producto 1', expiryDate: '2026-04-24' }];
        };

        // Iconos SVG
        const Plus = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        );

        const Trash2 = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
        );

        const AlertCircle = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        );

        const Calendar = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
        );

        const InventoryTracker = () => {
            const [products, setProducts] = useState(loadProducts);

            useEffect(() => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
            }, [products]);
            
            const getToday = () => {
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };
            
            const today = getToday();

            const calculateDays = (expiryDate) => {
                const now = new Date();
                const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                const [year, month, day] = expiryDate.split('-').map(Number);
                const expiry = new Date(year, month - 1, day);
                const diffTime = expiry - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                return diffDays;
            };

            const getStatus = (days) => {
                if (days < 0) return { text: 'VENCIDO', color: 'bg-red-600', textColor: 'text-white' };
                if (days === 0) return { text: 'VENCE HOY', color: 'bg-red-500', textColor: 'text-white' };
                if (days <= 30) return { text: 'URGENTE', color: 'bg-red-400', textColor: 'text-white' };
                if (days <= 60) return { text: 'ADVERTENCIA', color: 'bg-yellow-400', textColor: 'text-gray-900' };
                if (days <= 90) return { text: 'PRECAUCIÓN', color: 'bg-orange-400', textColor: 'text-white' };
                return { text: 'NORMAL', color: 'bg-green-500', textColor: 'text-white' };
            };

            const getCardColor = (days) => {
                if (days < 0) return 'bg-red-50 border-red-300';
                if (days <= 30) return 'bg-red-50 border-red-200';
                if (days <= 60) return 'bg-yellow-50 border-yellow-200';
                if (days <= 90) return 'bg-orange-50 border-orange-200';
                return 'bg-green-50 border-green-200';
            };

            const addProduct = () => {
                const newProduct = {
                    id: Date.now(),
                    name: `Producto ${products.length + 1}`,
                    expiryDate: today
                };
                setProducts([...products, newProduct]);
            };

            const removeProduct = (id) => {
                setProducts(products.filter(p => p.id !== id));
            };

            const updateProduct = (id, field, value) => {
                setProducts(products.map(p => 
                    p.id === id ? { ...p, [field]: value } : p
                ));
            };

            const formatDate = (dateString) => {
                const date = new Date(dateString);
                return date.toLocaleDateString('es-ES', { 
                    day: '2-digit', 
                    month: '2-digit', 
                    year: 'numeric' 
                });
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-green-50 to-blue-50 p-6">
                    <div className="max-w-6xl mx-auto">
                        {/* Header */}
                        <div className="bg-white rounded-xl shadow-lg p-6 mb-6">
                            <h1 className="text-3xl font-bold text-gray-800">
                                Sistema de Control de Vencimientos
                            </h1>
                        </div>

                        {/* Add Product Button */}
                        <div className="mb-6">
                            <button
                                onClick={addProduct}
                                className="bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-6 rounded-lg shadow-lg flex items-center gap-2 transition-colors"
                            >
                                <Plus />
                                Agregar Producto
                            </button>
                        </div>

                        {/* Products Grid */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {products.map(product => {
                                const daysRemaining = calculateDays(product.expiryDate);
                                const status = getStatus(daysRemaining);
                                const cardColor = getCardColor(daysRemaining);

                                return (
                                    <div key={product.id} className={`${cardColor} border-2 rounded-xl shadow-lg p-6 transition-all hover:shadow-xl`}>
                                        <div className="flex justify-between items-start mb-4">
                                            <input
                                                type="text"
                                                value={product.name}
                                                onChange={(e) => updateProduct(product.id, 'name', e.target.value)}
                                                className="text-xl font-bold bg-transparent border-b-2 border-gray-300 focus:border-green-600 outline-none w-full mr-2"
                                            />
                                            <button
                                                onClick={() => removeProduct(product.id)}
                                                className="text-red-500 hover:text-red-700 transition-colors"
                                            >
                                                <Trash2 />
                                            </button>
                                        </div>

                                        <div className="space-y-4">
                                            <div>
                                                <label className="block text-sm font-semibold text-gray-700 mb-2">
                                                    FECHA DE VENCIMIENTO
                                                </label>
                                                <input
                                                    type="date"
                                                    value={product.expiryDate}
                                                    onChange={(e) => updateProduct(product.id, 'expiryDate', e.target.value)}
                                                    className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-green-600 outline-none text-lg font-semibold"
                                                />
                                            </div>

                                            <div className={`${status.color} ${status.textColor} rounded-lg p-3 text-center font-bold`}>
                                                <div className="flex items-center justify-center gap-2">
                                                    <AlertCircle />
                                                    {status.text}
                                                </div>
                                            </div>

                                            <div className="bg-white rounded-lg p-4 shadow-inner">
                                                <div className="text-sm text-gray-600 mb-1">DÍAS RESTANTES</div>
                                                <div className={`text-4xl font-bold ${daysRemaining < 0 ? 'text-red-600' : daysRemaining <= 30 ? 'text-orange-600' : daysRemaining <= 60 ? 'text-yellow-600' : daysRemaining <= 90 ? 'text-amber-600' : 'text-green-600'}`}>
                                                    {daysRemaining < 0 ? '0' : daysRemaining}
                                                </div>
                                                {daysRemaining < 0 && (
                                                    <div className="text-sm text-red-600 mt-1">
                                                        Vencido hace {Math.abs(daysRemaining)} días
                                                    </div>
                                                )}
                                            </div>

                                            {daysRemaining >= 0 && (
                                                <div className="bg-white rounded-lg p-3 shadow-inner">
                                                    <div className="text-xs text-gray-600 mb-2">TIEMPO RESTANTE</div>
                                                    <div className="w-full bg-gray-200 rounded-full h-3">
                                                        <div
                                                            className={`h-3 rounded-full transition-all ${
                                                                daysRemaining <= 30 ? 'bg-red-500' : 
                                                                daysRemaining <= 60 ? 'bg-yellow-500' : 
                                                                daysRemaining <= 90 ? 'bg-amber-500' :
                                                                'bg-green-500'
                                                            }`}
                                                            style={{ width: `${Math.min(100, (daysRemaining / 120) * 100)}%` }}
                                                        ></div>
                                                    </div>
                                                    <div className="text-xs text-gray-500 mt-1 text-right">
                                                        {Math.min(100, Math.round((daysRemaining / 120) * 100))}%
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>

                        {products.length === 0 && (
                            <div className="bg-white rounded-xl shadow-lg p-12 text-center">
                                <AlertCircle />
                                <h3 className="text-xl font-semibold text-gray-600 mb-2">
                                    No hay productos registrados
                                </h3>
                                <p className="text-gray-500">
                                    Haz clic en "Agregar Producto" para comenzar
                                </p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        ReactDOM.render(<InventoryTracker />, document.getElementById('root'));
    </script>
</body>
</html>
